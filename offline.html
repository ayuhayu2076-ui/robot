<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1f6feb" />
  <title>オフライン | DarkPaw Controller</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <style>
    :root { color-scheme: dark; --bg:#0d1117; --text:#e6edf3; --accent:#1f6feb; --danger:#f85149; }
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; height:100%; background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    body { display:flex; align-items:center; justify-content:center; padding:24px; }
    .card { max-width:440px; text-align:center; padding:28px; border-radius:16px; background:#161b22; border:1px solid #30363d; }
    .icon { font-size:56px; margin:0 0 12px; }
    h1 { margin:0 0 8px; font-size:20px; }
    p { margin:8px 0 20px; color:#8b949e; font-size:14px; line-height:1.6; }
    button { background:var(--accent); color:#fff; border:0; border-radius:10px; padding:12px 18px; font-size:14px; font-weight:600; cursor:pointer; }
    button:active { opacity:.8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>ネットワークに接続できません</h1>
    <p>ロボットコントローラーを使用するには、Raspberry Pi と同じLANに接続してください。<br>接続を復旧後、下のボタンで再読み込みしてください。</p>
    <button onclick="location.reload()">再読み込み</button>
  </div>
</body>
</html>
